<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeSynergy · offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f9f9f7; --ink: #10233f; --sub: #4a5568; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121211; --ink: #ecebe7; --sub: #b3b1aa; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 32rem; padding: 24px; }
    p { color: var(--sub); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>VibeSynergy is niet bereikbaar</h1>
    <p>Er is geen verbinding met je server. Staat Tailscale aan? Probeer het zo opnieuw.</p>
    <p lang="en">VibeSynergy can't be reached. There is no connection to your server; is Tailscale on? Try again in a moment.</p>
    <p><a href="/">Opnieuw proberen · Try again</a></p>
  </main>
</body>
</html>
