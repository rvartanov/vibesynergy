name: Container

# The image for Linux, macOS and Windows (amd64 and arm64): ghcr.io/rvartanov/vibesynergy.
# A pull request builds it and checks that it starts; main pushes :latest, :main and :sha-…,
# a tag v* pushes that version too.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["**", "!**.md", "README.md", "THIRD_PARTY.md"]
  pull_request:
    paths: ["**", "!**.md", "README.md", "THIRD_PARTY.md"]

concurrency:
  group: container-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for this runner and check that it starts
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vibesynergy:check
          build-args: VIBESYNERGY_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: First start, login page, gate and health
        run: |
          docker run -d --name check -e VIBESYNERGY_EMAIL=ci@example.com \
            -p 127.0.0.1:18447:8447 vibesynergy:check
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:18447/login && break
            sleep 2
          done
          docker logs check 2>&1 | grep -q "/login#link=" || { docker logs check; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18447/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18447/api/meta)" = 401
          docker exec check python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8448/vibesynergy/health', timeout=5)"
          docker exec check vibesynergy version
          docker rm -f check
      - name: Image names
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64 and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VIBESYNERGY_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
