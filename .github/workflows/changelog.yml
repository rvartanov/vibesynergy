name: Changelog

# A pull request that changes the app says so in CHANGELOG.md (CONTRIBUTING.md#features-and-changelog).
# Its own workflow, so adding the no-changelog label re-runs only this.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: CHANGELOG.md updated, or labelled no-changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if ! grep -qE '^(src/|Dockerfile|deploy/)' <<<"$changed"; then exit 0; fi
          if grep -qx 'CHANGELOG.md' <<<"$changed"; then exit 0; fi
          if [[ ",$LABELS," == *",no-changelog,"* ]]; then exit 0; fi
          echo "::error::This pull request changes the app but not CHANGELOG.md. Add a line under Unreleased, or the label no-changelog for internal-only changes (CONTRIBUTING.md)."
          exit 1
